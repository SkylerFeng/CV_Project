paths:
  # BasicVSR++ comparison frames are stored as bicubic | BasicVSR++ | HR.
  basic_dir: /home/fc/Coding/CV/part2_1/results/basicvsrpp_compare_000/images
  basic_panel_index: 1
  basic_panel_count: 3

  # Use the left panel as an LR-up/bicubic reference in diagnostic grids.
  lr_panel_index: 0

  # Real-ESRGAN branch. Finetuned Real-ESRGAN is the default generative branch
  # because our observations show it is stronger on anime/line-art style content.
  generative_dir: /home/fc/Coding/CV/part2_2/results/infer_finetuned/000
  generative_suffix: "_out"

  output_dir: /home/fc/Coding/CV/part3/results/adaptive_hybrid_000

adaptive:
  # auto: estimate whether the sequence is more anime-like or real-like.
  # real: conservative Real-ESRGAN usage.
  # anime: stronger Real-ESRGAN usage for line art and flat-color regions.
  mode: auto
  anime_threshold: 0.50

  real_max_alpha: 0.28
  anime_max_alpha: 0.62
  min_alpha: 0.00

  texture_gain: 1.10
  line_gain: 0.85
  flat_gain: 0.45

  edge_protect_strength: 0.75
  temporal_protect_strength: 0.60
  disagreement_protect_strength: 0.85

  mask_blur_radius: 4.0
  gamma: 1.15

output:
  save_grids: true
  save_maps: true
  export_video: true
  fps: 30
