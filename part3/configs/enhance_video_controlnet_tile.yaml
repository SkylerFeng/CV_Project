paths:
  input_video: /home/fc/Coding/CV/data/custom/2.mp4
  output_dir: /home/fc/Coding/CV/part3/results/video2_controlnet_enhance

model:
  base_model: runwayml/stable-diffusion-v1-5
  controlnet_model: lllyasviel/control_v11f1e_sd15_tile
  torch_dtype: float16
  device: cuda

generation:
  prompt: clean sharp video frame, natural texture, faithful details, realistic, high quality
  negative_prompt: distorted geometry, changed object, text artifacts, oversharpening, flicker, painting, low quality
  num_inference_steps: 10
  guidance_scale: 4.5
  controlnet_conditioning_scale: 0.85
  strength: 0.15
  seed: 42

  # Keep this lower for 8GB GPUs. The output is resized back to original video size.
  max_side: 960
  multiple_of: 8

  # Use a small value for testing first. Set to null to process the full video.
  max_frames: 120
  fps: null
  keep_frames: true

